<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HardPulse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #ccc;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 12%, #2b0f1460 0%, transparent 35%),
        radial-gradient(circle at 85% 4%, #1b1b1b80 0%, transparent 28%),
        linear-gradient(transparent 95%, #1a1a1a66 96%);
      background-size: auto, auto, 100% 28px;
      pointer-events: none;
      z-index: -2;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: linear-gradient(90deg, transparent 95%, #1a1a1a66 96%);
      background-size: 28px 100%;
      pointer-events: none;
      z-index: -1;
    }

    /* ── Header ─────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px 0 10px;
      border-bottom: 1px solid #1a1a1a;
      background: #0d0d0dc9;
      backdrop-filter: blur(6px);
    }
    header .logo-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 8px;
      text-transform: uppercase;
    }
    header .logo-text .hard { color: #fff; }
    header .logo-text .pulse { color: #ff3c3c; text-shadow: 0 0 10px #ff3c3c; }
    header .tagline {
      font-size: 9px;
      letter-spacing: 4px;
      color: #444;
      text-transform: uppercase;
      margin-top: 4px;
      text-align: center;
    }

    /* ── Chat area ──────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #ddd;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #12080a;
      border: 1px solid #331111;
      color: #ddd;
    }
    .msg.assistant .label,
    .msg.user .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 6px;
      display: block;
    }
    .msg.user .label { color: #555; }
    .msg.assistant .label { color: #ff3c3c; }

    .msg.error {
      align-self: center;
      background: #1a0a0a;
      border: 1px solid #ff3c3c44;
      color: #ff6b6b;
      font-size: 12px;
    }

    /* Typing indicator */
    .typing {
      align-self: flex-start;
      display: flex;
      gap: 6px;
      padding: 14px 20px;
    }
    .typing span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff3c3c;
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* ── Input bar ──────────────────────────── */
    #input-bar {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid #1a1a1a;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      background: #0d0d0dcf;
      backdrop-filter: blur(6px);
    }

    #prompt {
      flex: 1;
      background: #111;
      border: 1px solid #2a2a2a;
      color: #eee;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 6px;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 140px;
    }
    #prompt:focus { border-color: #ff3c3c55; }
    #prompt::placeholder { color: #444; }

    #send-btn {
      background: #ff3c3c;
      border: none;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 24px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    #send-btn:hover { background: #ff5555; box-shadow: 0 0 14px #ff3c3c66; }
    #send-btn:disabled { background: #333; cursor: default; box-shadow: none; }

    /* ── Image upload button ─────────────────── */
    #img-btn {
      background: linear-gradient(180deg, #161616 0%, #101010 100%);
      border: 1px solid #2f2f2f;
      color: #7a7a7a;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px #ffffff08;
    }
    #img-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.18s ease;
    }
    #img-btn:hover {
      border-color: #7b3030;
      color: #ff6a6a;
      box-shadow: inset 0 0 0 1px #ff3c3c22, 0 0 14px #ff3c3c2f;
    }
    #img-btn:hover svg {
      transform: translateY(-0.5px);
    }
    #img-btn:active {
      transform: translateY(0.5px);
      background: #140d0d;
    }

    /* ── Image preview strip ─────────────────── */
    #img-preview {
      display: none;
      gap: 8px;
      padding: 8px 20px 0;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      flex-wrap: wrap;
    }
    #img-preview.has-images { display: flex; }
    .img-thumb {
      position: relative;
      width: 64px; height: 64px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #333;
    }
    .img-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .img-thumb .remove {
      position: absolute;
      top: 2px; right: 2px;
      background: #0a0a0aCC;
      color: #ff3c3c;
      border: none;
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .msg img.chat-img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 6px;
      margin-top: 8px;
      display: block;
      border: 1px solid #333;
    }

    /* ── Scrollbar ───────────────────────────── */
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }

    /* ── Pulse dot in header ─────────────────── */
    .pulse-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff3c3c;
      box-shadow: 0 0 10px #ff3c3c;
      animation: pdot 1.5s infinite;
      display: inline-block;
      margin-left: 8px;
    }
    @keyframes pdot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Splash screen ───────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      font-family: 'Courier New', monospace;
      transition: opacity 1s ease, visibility 1s ease;
    }
    #splash .splash-visual {
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 20px 20px 16px;
      background: radial-gradient(circle at 50% 40%, #131313 0%, #0b0b0b 65%, #0a0a0a 100%);
      box-shadow: 0 0 24px #000000aa;
    }
    #splash .splash-visual svg {
      display: block;
      max-width: min(88vw, 660px);
      height: auto;
    }
    #splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #splash .splash-wordmark {
      font-size: 32px;
      letter-spacing: 12px;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
    }
    #splash .splash-wordmark .hard { color: #fff; }
    #splash .splash-wordmark .pulse { color: #ff3c3c; text-shadow: 0 0 10px #ff3c3c; }
    #splash .splash-tagline {
      font-size: 10px;
      letter-spacing: 6px;
      color: #555;
      text-transform: uppercase;
      margin-top: 10px;
    }
    #splash .splash-dots {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    #splash .splash-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #333;
      transition: all 0.2s ease;
    }
    #splash .splash-dots span.active {
      width: 8px; height: 8px;
      background: #ff3c3c;
      box-shadow: 0 0 10px #ff3c3c;
      animation: pdot 1.5s infinite;
    }
    #splash .splash-status {
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      color: #8a8a8a;
      min-height: 14px;
      text-transform: uppercase;
    }
    #splash .splash-progress {
      width: min(420px, 80vw);
      height: 8px;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      background: #111;
      overflow: hidden;
      margin-top: -24px;
    }
    #splash .splash-progress .fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #552020 0%, #ff3c3c 100%);
      box-shadow: 0 0 12px #ff3c3c88;
      transition: width 0.45s ease;
    }
    #splash .boot-note {
      font-size: 9px;
      letter-spacing: 3px;
      color: #494949;
      text-transform: uppercase;
      margin-top: -34px;
    }
    /* Staggered fade-in for splash SVG elements */
    #splash svg .stage { opacity: 0; animation: stageIn 0.6s ease forwards; }
    #splash svg .stage-1 { animation-delay: 0.3s; }
    #splash svg .stage-2 { animation-delay: 0.9s; }
    #splash svg .stage-3 { animation-delay: 1.5s; }
    #splash svg .connectors { opacity: 0; animation: stageIn 0.4s ease forwards; animation-delay: 1.2s; }
    #splash svg .connectors-2 { animation-delay: 1.8s; }
    #splash svg .stage .platter,
    #splash svg .stage .platter-rings,
    #splash svg .stage .platter-highlight {
      transform-box: fill-box;
      transform-origin: center;
      animation: platterSpin 1.3s linear infinite;
    }
    #splash svg .stage-2 .platter,
    #splash svg .stage-2 .platter-rings,
    #splash svg .stage-2 .platter-highlight {
      animation-duration: 1s;
    }
    #splash svg .stage-3 .platter,
    #splash svg .stage-3 .platter-rings,
    #splash svg .stage-3 .platter-highlight {
      animation-duration: 0.75s;
    }
    #splash svg .stage .arm {
      transform-box: fill-box;
      transform-origin: 88% 24%;
      animation: armSweep 2.2s ease-in-out infinite;
    }
    #splash svg .stage-2 .arm { animation-duration: 1.8s; }
    #splash svg .stage-3 .arm { animation-duration: 1.2s; }
    #splash svg .stage-1 .floppy-shell {
      transform-box: fill-box;
      transform-origin: center;
      animation: floppyRock 2.8s ease-in-out infinite;
    }
    #splash svg .stage-1 .floppy-shutter {
      animation: shutterSlide 1.6s ease-in-out infinite;
    }
    #splash svg .stage-1 .floppy-hub-group {
      transform-box: fill-box;
      transform-origin: center;
      animation: hubSpin 1.1s linear infinite;
    }
    #splash svg .stage-3 .ssd-body {
      animation: ssdBreathe 2.2s ease-in-out infinite;
    }
    #splash svg .stage-3 .ssd-chip {
      animation: chipPulse 1.2s ease-in-out infinite;
    }
    #splash svg .stage-3 .ssd-chip.chip-2 { animation-delay: 0.2s; }
    #splash svg .stage-3 .ssd-chip.chip-3 { animation-delay: 0.4s; }
    #splash svg .stage-3 .ssd-trace {
      animation: traceFlicker 1s ease-in-out infinite;
    }
    @keyframes stageIn {
      to { opacity: 1; }
    }
    @keyframes platterSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes armSweep {
      0%, 100% { transform: rotate(-5deg) translateX(0); }
      50% { transform: rotate(5deg) translateX(-2px); }
    }
    @keyframes floppyRock {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1deg); }
    }
    @keyframes shutterSlide {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(1.5px); }
    }
    @keyframes hubSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ssdBreathe {
      0%, 100% { filter: drop-shadow(0 0 0px #ff3c3c); }
      50% { filter: drop-shadow(0 0 6px #ff3c3c66); }
    }
    @keyframes chipPulse {
      0%, 100% { fill: #232323; }
      50% { fill: #322020; }
    }
    @keyframes traceFlicker {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- ═══ SPLASH SCREEN ═══ -->
  <div id="splash">
    <div class="splash-visual">
      <svg width="660" height="240" viewBox="0 0 660 240">
      <defs>
        <linearGradient id="splashPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#333" />
          <stop offset="100%" stop-color="#ff3c3c" />
        </linearGradient>
        <filter id="splashGlow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur" />
          <feMerge>
            <feMergeNode in="coloredBlur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Stage 1: Classic floppy disk -->
      <g class="stage stage-1" transform="translate(110, 120) rotate(10)">
        <rect class="floppy-shell" x="-62" y="-52" width="124" height="104" rx="5"
          fill="#181818" stroke="#4a4a4a" stroke-width="2" />
        <rect class="floppy-shutter" x="-56" y="-46" width="112" height="30" rx="2"
          fill="#111" stroke="#333" stroke-width="1" />
        <rect x="-40" y="-40" width="80" height="14" rx="1"
          fill="#2b2b2b" stroke="#555" stroke-width="0.8" />
        <rect x="-52" y="-8" width="104" height="52" rx="3"
          fill="#262626" stroke="#3d3d3d" stroke-width="1" />
        <rect x="-46" y="-2" width="92" height="14" rx="2"
          fill="#f0f0f0" stroke="#aaaaaa" stroke-width="0.8" />
        <line x1="-38" y1="4" x2="14" y2="4" stroke="#b8b8b8" stroke-width="1" />
        <line x1="-38" y1="8" x2="20" y2="8" stroke="#b8b8b8" stroke-width="1" />
        <g class="floppy-hub-group" transform="translate(35, 26)">
          <circle cx="0" cy="0" r="11" fill="#2f2f2f" stroke="#555" stroke-width="1" />
          <line x1="0" y1="0" x2="0" y2="-8" stroke="#6f6f6f" stroke-width="1" />
          <circle cx="0" cy="0" r="4" fill="#3f3f3f" stroke="#666" stroke-width="0.8" />
        </g>
        <circle cx="-50" cy="-40" r="2.5" fill="none" stroke="#555" stroke-width="0.8" />
        <circle cx="50" cy="-40" r="2.5" fill="none" stroke="#555" stroke-width="0.8" />
        <circle cx="-50" cy="40" r="2.5" fill="none" stroke="#555" stroke-width="0.8" />
        <circle cx="50" cy="40" r="2.5" fill="none" stroke="#555" stroke-width="0.8" />
      </g>

      <!-- Connector 1 -->
      <g class="connectors">
        <line x1="178" y1="115" x2="262" y2="115" stroke="url(#splashPulseGrad)" stroke-width="1.5" stroke-dasharray="6 4" />
        <polygon points="262,112 262,118 270,115" fill="#888" />
      </g>

      <!-- Stage 2: Transition-era spinning disk -->
      <g class="stage stage-2" transform="translate(330, 115) rotate(6)">
        <rect x="-64" y="-50" width="128" height="100" rx="10"
          fill="#1a1a1a" stroke="#777" stroke-width="2" />
        <circle cx="-54" cy="-40" r="3" fill="none" stroke="#555" stroke-width="1" />
        <circle cx="54" cy="-40" r="3" fill="none" stroke="#555" stroke-width="1" />
        <circle cx="-54" cy="40" r="3" fill="none" stroke="#555" stroke-width="1" />
        <circle cx="54" cy="40" r="3" fill="none" stroke="#555" stroke-width="1" />
        <circle class="platter" cx="-8" cy="1" r="31" fill="#343434" stroke="#777" stroke-width="1.5" />
        <circle class="platter-rings" cx="-8" cy="1" r="24" fill="none" stroke="#5d5d5d" stroke-width="0.6" />
        <circle class="platter-rings" cx="-8" cy="1" r="16" fill="none" stroke="#5d5d5d" stroke-width="0.6" />
        <ellipse class="platter-highlight" cx="-18" cy="-10" rx="15" ry="8" fill="none" stroke="#888" stroke-width="0.35"
          transform="rotate(-26, -18, -10)" />
        <circle cx="-8" cy="1" r="4.5" fill="#4b4b4b" stroke="#777" stroke-width="1" />
        <path class="arm" d="M 38 -24 Q 28 -8 14 3 Q 6 10 -1 13"
          fill="none" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" />
        <circle cx="38" cy="-24" r="6" fill="#2f2f2f" stroke="#777" stroke-width="1.3" />
        <path d="M -1 13 l -6 3 l 3 2" fill="none" stroke="#9a9a9a" stroke-width="1.4" />
        <rect x="26" y="15" width="26" height="22" rx="2" fill="#262626" stroke="#575757" stroke-width="1" />
        <line x1="30" y1="22" x2="48" y2="22" stroke="#666" stroke-width="1" />
        <line x1="30" y1="27" x2="48" y2="27" stroke="#666" stroke-width="1" />
        <line x1="30" y1="32" x2="44" y2="32" stroke="#666" stroke-width="1" />
      </g>

      <!-- Connector 2 -->
      <g class="connectors connectors-2">
        <line x1="398" y1="115" x2="482" y2="115" stroke="#ff3c3c" stroke-width="1.5" stroke-dasharray="6 4"
          style="filter: drop-shadow(0 0 6px #ff3c3c)" />
        <polygon points="482,112 482,118 490,115" fill="#ff3c3c"
          style="filter: drop-shadow(0 0 4px #ff3c3c)" />
      </g>

      <!-- Stage 3: Modern SSD -->
      <g class="stage stage-3" transform="translate(550, 115)" filter="url(#splashGlow)">
        <rect class="ssd-body" x="-65" y="-38" width="130" height="76" rx="8"
          fill="#101010" stroke="#ff3c3c" stroke-width="2" />
        <rect class="ssd-body" x="-52" y="-22" width="104" height="44" rx="4"
          fill="#181818" stroke="#5a1e1e" stroke-width="1" />
        <rect class="ssd-chip chip-1" x="-44" y="-14" width="26" height="28" rx="2" fill="#232323" stroke="#ff3c3c" stroke-width="0.8" />
        <rect class="ssd-chip chip-2" x="-12" y="-14" width="26" height="28" rx="2" fill="#232323" stroke="#ff3c3c" stroke-width="0.8" />
        <rect class="ssd-chip chip-3" x="20" y="-14" width="26" height="28" rx="2" fill="#232323" stroke="#ff3c3c" stroke-width="0.8" />
        <line class="ssd-trace" x1="-38" y1="0" x2="40" y2="0" stroke="#ff3c3c" stroke-width="0.9" opacity="0.65" />
        <line class="ssd-trace" x1="-38" y1="-6" x2="40" y2="-6" stroke="#662222" stroke-width="0.8" />
        <line class="ssd-trace" x1="-38" y1="6" x2="40" y2="6" stroke="#662222" stroke-width="0.8" />
        <rect x="-14" y="32" width="28" height="6" rx="1" fill="#b07d2a" />
        <line x1="-12" y1="33" x2="-12" y2="37" stroke="#6b4f1d" stroke-width="0.8" />
        <line x1="-8" y1="33" x2="-8" y2="37" stroke="#6b4f1d" stroke-width="0.8" />
        <line x1="-4" y1="33" x2="-4" y2="37" stroke="#6b4f1d" stroke-width="0.8" />
        <line x1="0" y1="33" x2="0" y2="37" stroke="#6b4f1d" stroke-width="0.8" />
        <line x1="4" y1="33" x2="4" y2="37" stroke="#6b4f1d" stroke-width="0.8" />
        <line x1="8" y1="33" x2="8" y2="37" stroke="#6b4f1d" stroke-width="0.8" />
        <line x1="12" y1="33" x2="12" y2="37" stroke="#6b4f1d" stroke-width="0.8" />
        <circle cx="50" cy="-24" r="3" fill="none" stroke="#cc2222" stroke-width="1" />
        <circle cx="-50" cy="24" r="3" fill="none" stroke="#cc2222" stroke-width="1" />
      </g>
      </svg>
    </div>

    <div>
      <div class="splash-wordmark">
        <span class="hard">HARD</span><span class="pulse">PULSE</span>
      </div>
      <div class="splash-tagline">The software that finds your hardware</div>
    </div>

    <div class="splash-dots">
      <span></span><span></span><span class="active"></span>
    </div>
    <div class="splash-status" id="splash-status">Booting diagnostics...</div>
    <div class="splash-progress"><div class="fill" id="splash-progress-fill"></div></div>
    <div class="boot-note">Floppy integrity check in progress</div>
  </div>

  <!-- ═══ MAIN APP ═══ -->
  <header>
    <div>
      <div class="logo-text">
        <span class="hard">HARD</span><span class="pulse">PULSE</span>
        <span class="pulse-dot"></span>
      </div>
      <div class="tagline">The software that finds your hardware</div>
    </div>
  </header>

  <div id="chat"></div>

  <div id="img-preview"></div>
  <div id="input-bar">
    <button id="img-btn" title="Attach image" aria-label="Attach image">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="6" width="18" height="14" rx="2.5"></rect>
        <path d="M8 6l1.2-2h5.6L16 6"></path>
        <circle cx="12" cy="13" r="3.2"></circle>
      </svg>
    </button>
    <input type="file" id="img-input" accept="image/*" multiple hidden />
    <textarea id="prompt" rows="1" placeholder="Ask HardPulse anything... (paste or attach images)" autofocus></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send-btn");
    const imgBtn = document.getElementById("img-btn");
    const imgInput = document.getElementById("img-input");
    const imgPreview = document.getElementById("img-preview");

    let messages = [];   // conversation history sent to API
    let pendingImages = [];  // base64 data URLs of attached images

    // ── Image handling ──────────────────────────
    imgBtn.addEventListener("click", () => imgInput.click());

    imgInput.addEventListener("change", (e) => {
      for (const file of e.target.files) addImageFile(file);
      imgInput.value = "";
    });

    // Paste images from clipboard
    promptEl.addEventListener("paste", (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith("image/")) {
          e.preventDefault();
          addImageFile(item.getAsFile());
        }
      }
    });

    // Drag and drop
    document.body.addEventListener("dragover", (e) => e.preventDefault());
    document.body.addEventListener("drop", (e) => {
      e.preventDefault();
      for (const file of e.dataTransfer.files) {
        if (file.type.startsWith("image/")) addImageFile(file);
      }
    });

    function addImageFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        pendingImages.push(dataUrl);
        renderImagePreview();
      };
      reader.readAsDataURL(file);
    }

    function renderImagePreview() {
      imgPreview.innerHTML = "";
      imgPreview.className = pendingImages.length ? "has-images" : "";
      pendingImages.forEach((src, i) => {
        const thumb = document.createElement("div");
        thumb.className = "img-thumb";
        thumb.innerHTML = `<img src="${src}"><button class="remove" data-idx="${i}">&times;</button>`;
        thumb.querySelector(".remove").addEventListener("click", () => {
          pendingImages.splice(i, 1);
          renderImagePreview();
        });
        imgPreview.appendChild(thumb);
      });
    }

    function addMsg(role, text, images) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = role === "user" ? "You" : "HardPulse";
      div.appendChild(label);
      if (images && images.length) {
        images.forEach(src => {
          const img = document.createElement("img");
          img.src = src;
          img.className = "chat-img";
          div.appendChild(img);
        });
      }
      if (text) div.appendChild(document.createTextNode(text));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "typing";
      div.id = "typing-indicator";
      div.innerHTML = "<span></span><span></span><span></span>";
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
    function hideTyping() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    async function send() {
      const text = promptEl.value.trim();
      const images = [...pendingImages];
      if (!text && !images.length) return;

      promptEl.value = "";
      promptEl.style.height = "44px";
      pendingImages = [];
      renderImagePreview();
      sendBtn.disabled = true;

      addMsg("user", text, images);

      // Build content array for vision API
      const content = [];
      images.forEach(dataUrl => {
        content.push({ type: "image_url", image_url: { url: dataUrl } });
      });
      if (text) content.push({ type: "text", text: text });

      messages.push({ role: "user", content: content.length === 1 && !images.length ? text : content });

      showTyping();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        const data = await res.json();
        hideTyping();

        if (data.error) {
          const errDiv = document.createElement("div");
          errDiv.className = "msg error";
          errDiv.textContent = "Error: " + data.error;
          chat.appendChild(errDiv);
        } else {
          addMsg("assistant", data.reply);
          messages.push({ role: "assistant", content: data.reply });
        }
      } catch (e) {
        hideTyping();
        const errDiv = document.createElement("div");
        errDiv.className = "msg error";
        errDiv.textContent = "Network error: " + e.message;
        chat.appendChild(errDiv);
      }

      sendBtn.disabled = false;
      promptEl.focus();
      chat.scrollTop = chat.scrollHeight;
    }

    sendBtn.addEventListener("click", send);
    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    // Auto-resize textarea
    promptEl.addEventListener("input", () => {
      promptEl.style.height = "44px";
      promptEl.style.height = Math.min(promptEl.scrollHeight, 140) + "px";
    });

    // ── Splash screen sequence ─────────────────
    const splashStatus = document.getElementById("splash-status");
    const splashProgressFill = document.getElementById("splash-progress-fill");
    const splashDots = Array.from(document.querySelectorAll("#splash .splash-dots span"));
    const bootSteps = [
      "Booting diagnostics...",
      "Spinning floppy platter...",
      "Calibrating read heads...",
      "Loading HardPulse UI..."
    ];

    let bootIndex = 0;
    function setBootStep(index) {
      splashStatus.textContent = bootSteps[index];
      splashProgressFill.style.width = `${((index + 1) / bootSteps.length) * 100}%`;
      splashDots.forEach((dot, i) => {
        dot.classList.toggle("active", i === index % splashDots.length);
      });
    }

    setBootStep(0);
    const splashInterval = setInterval(() => {
      bootIndex += 1;
      if (bootIndex < bootSteps.length) {
        setBootStep(bootIndex);
      }
    }, 850);

    setTimeout(() => {
      clearInterval(splashInterval);
      document.getElementById("splash").classList.add("fade-out");
    }, 3800);
  </script>
</body>
</html>
